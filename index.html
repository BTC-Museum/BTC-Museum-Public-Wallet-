<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OldChain (OLDC) – Bitcoin Museum Wallet</title>
  <style>
    body {
      background-color: #0d0d0d;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #f7931a;
      font-size: 28px;
      margin-bottom: 10px;
    }
    h2 {
      color: #bbb;
      font-size: 20px;
      margin-top: 5px;
    }
    #balance {
      font-size: 22px;
      color: #00ffae;
      margin: 20px 0;
    }
    .transaction {
      background-color: #1a1a1a;
      padding: 10px;
      margin: 10px auto;
      border-radius: 10px;
      max-width: 600px;
      text-align: left;
      border: 1px solid #333;
    }
    .transaction:hover {
      background-color: #222;
    }
    a {
      color: #f7931a;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    footer {
      margin-top: 40px;
      font-size: 14px;
      color: #888;
    }
    .loading {
      color: #aaa;
      font-size: 18px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>OldChain (OLDC) – Bitcoin Museum Public Wallet</h1>
  <h2>Full transparency. Every transaction remains forever on the blockchain.</h2>

  <div id="balance">Loading balance...</div>
  <div id="transactions">
    <div class="loading">Loading transactions, please wait...</div>
  </div>

  <footer>
    Powered by OldChain (OLDC) • Bitcoin Museum Wallet
  </footer>

  <script>
    const address = 'bc1qhafmeu2jntmfr8t8an9y09gkfqv3ac83vldwtj';
    const balanceElement = document.getElementById('balance');
    const transactionsElement = document.getElementById('transactions');

    async function loadWalletData() {
      try {
        // Fetch address data
        const res = await fetch(`https://mempool.space/api/address/${address}`);
        const data = await res.json();

        const balanceBTC = data.chain_stats.funded_txo_sum - data.chain_stats.spent_txo_sum;
        const btcValue = balanceBTC / 100000000;

        balanceElement.textContent = `Current Balance: ${btcValue.toFixed(8)} BTC`;

        // Fetch transactions
        const txsRes = await fetch(`https://mempool.space/api/address/${address}/txs`);
        const txs = await txsRes.json();

        transactionsElement.innerHTML = '';

        txs.forEach(tx => {
          const div = document.createElement('div');
          div.classList.add('transaction');

          const time = new Date(tx.status.block_time * 1000).toLocaleString();
          const amount = tx.vout.reduce((sum, v) => sum + (v.scriptpubkey_address === address ? v.value : 0), 0) / 100000000;

          div.innerHTML = `
            <strong>TXID:</strong> <a href="https://mempool.space/tx/${tx.txid}" target="_blank">${tx.txid.slice(0, 25)}...</a><br>
            <strong>Date:</strong> ${time}<br>
            <strong>Amount:</strong> ${amount.toFixed(8)} BTC<br>
            <strong>Block:</strong> ${tx.status.block_height || 'Pending'}
          `;

          transactionsElement.appendChild(div);
        });

      } catch (err) {
        balanceElement.textContent = 'Error loading data. Please try again later.';
        transactionsElement.innerHTML = '<div class="loading">Unable to load transactions at this time.</div>';
      }
    }

    loadWalletData();
  </script>
</body>
</html>
