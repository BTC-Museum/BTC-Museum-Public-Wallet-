<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OldChain (OLDC) - Bitcoin Museum Public Wallet</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #161b22;
      padding: 20px;
    }
    h1 {
      color: #f7931a;
    }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #30363d;
    }
    a {
      color: #58a6ff;
      text-decoration: none;
    }
    footer {
      margin: 30px;
      color: #8b949e;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>OldChain (OLDC) – Bitcoin Museum Public Wallet</h1>
    <p>Full transparency. Every transaction remains forever on the blockchain.</p>
  </header>

  <div id="content">
    <p>Loading transactions...</p>
  </div>

  <footer>
    <p>Powered by OldChain (OLDC) • Data from mempool.space • 100% watch-only</p>
  </footer>

  <script>
    const ZPUB = "zpub6ndNUNfTLkvjFzL9Hw9hBn7X38y1DkXHMJxGa3NV2XhQfu6Nn3zsqf1VSQYuSf5dataE7fYhjxGyWJTGFoNumS2oGLZw32MS4hyBWmaTczS";
    const API = "https://mempool.space/api/address/";

    async function getAddressesFromZpub(zpub, count = 10) {
      // to simplify: use electrumx path for first few addresses
      const response = await fetch(`https://mempool.space/api/v1/addresses/xpub/${zpub}`);
      if (!response.ok) {
        document.getElementById("content").innerHTML = `<p>⚠️ Error loading data. Please try again later.</p>`;
        return;
      }
      const data = await response.json();
      showTransactions(data);
    }

    function showTransactions(addresses) {
      if (!addresses || !addresses.length) {
        document.getElementById("content").innerHTML = "<p>No transactions yet.</p>";
        return;
      }
      let html = `
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Amount (BTC)</th>
            <th>Transaction</th>
          </tr>
        </thead>
        <tbody>`;
      addresses.forEach(addr => {
        addr.transactions.forEach(tx => {
          const date = new Date(tx.status.block_time * 1000).toLocaleString();
          html += `
            <tr>
              <td>${date}</td>
              <td>${(tx.vout[0].value / 100000000).toFixed(8)}</td>
              <td><a href="https://mempool.space/tx/${tx.txid}" target="_blank">${tx.txid.slice(0, 15)}...</a></td>
            </tr>`;
        });
      });
      html += "</tbody></table>";
      document.getElementById("content").innerHTML = html;
    }

    getAddressesFromZpub(ZPUB);
  </script>
</body>
</html>
